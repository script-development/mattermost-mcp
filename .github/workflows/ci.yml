name: CI

# PR gate for mattermost-mcp. The build must compile and the static gates
# (lint, format, typecheck) must pass before anything reaches main. The live
# checks (`smoke`, `handshake`) are intentionally NOT run here — they hit a real
# Mattermost server and need MM_URL + MM_TOKEN, so they stay a local-only check.

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# A newer push to the same ref supersedes the in-flight run.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        name: build-and-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install (locked)
              run: npm ci

            - name: Lint (oxlint)
              run: npm run lint

            - name: Format check (oxfmt)
              run: npm run format:check

            - name: Build (tsc)
              run: npm run build

            # The build config scopes itself to src/**; this type-checks test/** too.
            - name: Typecheck (incl. tests)
              run: npm run typecheck
